services:
    bingers-sync:
        image: ghcr.io/vicegold/bingers-sync:latest
        restart: unless-stopped
        environment:
            # Fill in the three below. This file is tracked in git, so if you push
            # this repo anywhere, keep your real token out of the commit --
            # `git update-index --skip-worktree docker-compose.yml` is the usual trick.
            - PLEX_URL=http://192.168.x.x:32400 # plex base url, use the LAN ip not a hostname
            - PLEX_TOKEN= # plex api token
            - ALLOWED_USER= # whose activity to sync, everyone else is ignored
            # - BINGERS_SESSION_COOKIE= # leave unset; the session comes from /setup and lives in the db
            # - DRY_RUN=true # log writes instead of sending them, only "false" disables it
            # - PORT=8787 # port the service listens on
            # - DB_PATH=/data/bingers-sync.db # sqlite file, keep it under the bind mount
            # - NOTIFY_URL= # webhook for failures and write-halts, unset means log only
            # - CATALOG_TTL_HOURS=24 # how long a cached versions.json is trusted
            # - PLEX_ALLLEAVES_TTL_MIN=60 # min gap between backfill scans of the same show
            # - SYNC_PULL_INTERVAL_MIN=30 # how often the local mirror refreshes
            # - WATCH_DATE_TOLERANCE_SEC=120 # skip the date fix if the server stamp is this close
            # - SEARCH_MAX_PAGES=3 # search pages checked before giving up on a title
            # - BINGERS_USER_AGENT= # ua sent to bingers, defaults to the real app's
            # - REVERSE_SYNC=false # opt-in: add bingers follows to the plex watchlist, only "true" enables it
            # - REVERSE_BATCH=10 # titles reconciled per pull, keeps the first run calm
            # - RATING_SYNC=false # sync ratings both ways, off by default
        volumes:
            - ./data:/data
        ports:
            - 8787:8787

