services:
  bingers-sync:
    # Published by CI on every push to main (linux/amd64).
    # Pin to a :<sha> tag instead of :latest when you want reproducible deploys.
    image: ghcr.io/vicegold/bingers-sync:latest
    pull_policy: always
    restart: unless-stopped
    ports: ["8787:8787"]
    env_file: .env
    volumes: ["./data:/data"]
    healthcheck:
      # /health reports dryRun, session days remaining, whether writes are
      # halted, outbox depth and mirror freshness.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Local iteration: `docker compose --profile dev up --build bingers-sync-dev`
  # Builds from source instead of pulling the published image.
  bingers-sync-dev:
    profiles: ["dev"]
    build: .
    restart: unless-stopped
    ports: ["8787:8787"]
    env_file: .env
    volumes: ["./data:/data"]
