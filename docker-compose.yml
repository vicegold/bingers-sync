services:
    bingers-sync:
        image: ghcr.io/vicegold/bingers-sync:latest
        restart: unless-stopped
        environment:
            - BINGERS_SESSION_COOKIE=${BINGERS_SESSION_COOKIE:-} # optional seed, normally empty; the session comes from /setup and lives in the db
            - PLEX_URL=${PLEX_URL} # plex base url, use the LAN ip not a hostname
            - PLEX_TOKEN=${PLEX_TOKEN} # plex api token
            - ALLOWED_USER=${ALLOWED_USER} # whose activity to sync, everyone else is ignored
            # - DRY_RUN=true # log writes instead of sending them, only "false" disables it
            # - PORT=8787 # port the service listens on
            # - DB_PATH=/data/bingers-sync.db # sqlite file, keep it under the bind mount
            # - NOTIFY_URL= # webhook for failures and write-halts, unset means log only
            # - CATALOG_TTL_HOURS=24 # how long a cached versions.json is trusted
            # - PLEX_ALLLEAVES_TTL_MIN=60 # min gap between backfill scans of the same show
            # - SYNC_PULL_INTERVAL_MIN=30 # how often the local mirror refreshes
            # - WATCH_DATE_TOLERANCE_SEC=120 # skip the date fix if the server stamp is this close
            # - SEARCH_MAX_PAGES=3 # search pages checked before giving up on a title
            # - BINGERS_USER_AGENT= # ua sent to bingers, defaults to the real app's
        volumes:
            - ./data:/data
        ports:
            - 8787:8787

    bingers-sync-dev:
        profiles:
            - dev
        build: .
        restart: unless-stopped
        environment:
            - BINGERS_SESSION_COOKIE=${BINGERS_SESSION_COOKIE:-}
            - PLEX_URL=${PLEX_URL}
            - PLEX_TOKEN=${PLEX_TOKEN}
            - ALLOWED_USER=${ALLOWED_USER}
        volumes:
            - ./data:/data
        ports:
            - 8787:8787
