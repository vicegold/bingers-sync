services:
    bingers-sync:
        image: ghcr.io/vicegold/bingers-sync:latest
        restart: unless-stopped
        environment:
            # secrets come from .env, everything else is set here
            - BINGERS_SESSION_COOKIE=${BINGERS_SESSION_COOKIE}
            - PLEX_URL=${PLEX_URL}
            - PLEX_TOKEN=${PLEX_TOKEN}
            - DRY_RUN=true
            - ALLOWED_USER=plexuser
            - PORT=8787
            - DB_PATH=/data/bingers-sync.db
            - NOTIFY_URL=
            - CATALOG_TTL_HOURS=24
            - PLEX_ALLLEAVES_TTL_MIN=60
            - SYNC_PULL_INTERVAL_MIN=30
            - WATCH_DATE_TOLERANCE_SEC=120
            - SEARCH_MAX_PAGES=3
        volumes:
            - ./data:/data
        ports:
            - 8787:8787

    bingers-sync-dev:
        profiles:
            - dev
        build: .
        restart: unless-stopped
        environment:
            - BINGERS_SESSION_COOKIE=${BINGERS_SESSION_COOKIE}
            - PLEX_URL=${PLEX_URL}
            - PLEX_TOKEN=${PLEX_TOKEN}
            - DRY_RUN=true
            - ALLOWED_USER=plexuser
            - PORT=8787
            - DB_PATH=/data/bingers-sync.db
            - NOTIFY_URL=
            - CATALOG_TTL_HOURS=24
            - PLEX_ALLLEAVES_TTL_MIN=60
            - SYNC_PULL_INTERVAL_MIN=30
            - WATCH_DATE_TOLERANCE_SEC=120
            - SEARCH_MAX_PAGES=3
        volumes:
            - ./data:/data
        ports:
            - 8787:8787
